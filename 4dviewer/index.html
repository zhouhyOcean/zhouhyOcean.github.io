<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <title>WebGL Spacetime Gaussian Splat Viewer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* 现有样式 */
      body {
        overflow: hidden;
        margin: 0;
        height: 100vh;
        width: 100vw;
        font-family: sans-serif;
        background: black;
        text-shadow: 0 0 3px black;
      }
      a,
      body {
        color: white;
      }
      #info {
        z-index: 100;
        position: absolute;
        top: 10px;
        left: 15px;
      }
      h3 {
        margin: 5px 0;
      }
      p {
        margin: 5px 0;
        font-size: small;
      }

      /* 轮播组件样式 */
      .carousel-container {
        position: relative;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        overflow: hidden;
      }
      .carousel {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .carousel-inner {
        display: flex;
        transition: transform 0.5s ease;
      }
      .carousel-item {
        min-width: 100%;
        box-sizing: border-box;
      }
      .carousel-item img {
        width: 100%;
        display: block;
      }
      .carousel-control-prev,
      .carousel-control-next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        padding: 10px;
        cursor: pointer;
        z-index: 10;
      }
      .carousel-control-prev {
        left: 0;
      }
      .carousel-control-next {
        right: 0;
      }
    </style>
  </head>
  <body>
    <!-- 轮播组件 -->
    <div class="carousel-container" id="carouselContainer">
      <div class="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="image1.jpg" alt="Image 1">
          </div>
          <div class="carousel-item">
            <img src="image2.jpg" alt="Image 2">
          </div>
          <div class="carousel-item">
            <img src="image3.jpg" alt="Image 3">
          </div>
        </div>
        <button class="carousel-control-prev" id="carouselPrev">
          <span>&#8249;</span>
        </button>
        <button class="carousel-control-next" id="carouselNext">
          <span>&#8250;</span>
        </button>
      </div>
    </div>

    <!-- 现有内容 -->
    <div id="info">
      <p></p>
    </div>
    <div id="progress"></div>
    <div id="message"></div>
    <div class="scene" id="spinner">
      <div class="cube-wrapper">
        <div class="cube">
          <div class="cube-faces">
            <div class="cube-face bottom"></div>
            <div class="cube-face top"></div>
            <div class="cube-face left"></div>
            <div class="cube-face right"></div>
            <div class="cube-face back"></div>
            <div class="cube-face front"></div>
          </div>
        </div>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <button id="toggleButton">Pause</button>
    <div id="quality">
      <span id="fps"></span>
    </div>
    <div id="caminfo">
      <span id="camid"></span>
    </div>

    <script type="module" src="hybrid.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const carouselInner = document.querySelector(".carousel-inner");
        const carouselItems = document.querySelectorAll(".carousel-item");
        const carouselPrev = document.getElementById("carouselPrev");
        const carouselNext = document.getElementById("carouselNext");
        let currentIndex = 0;

        function showCarouselItem(index) {
          carouselInner.style.transform = `translateX(-${index * 100}%)`;
          currentIndex = index;
        }

        carouselPrev.addEventListener("click", () => {
          const newIndex = (currentIndex - 1 + carouselItems.length) % carouselItems.length;
          showCarouselItem(newIndex);
        });

        carouselNext.addEventListener("click", () => {
          const newIndex = (currentIndex + 1) % carouselItems.length;
          showCarouselItem(newIndex);
        });

        let autoPlayInterval;
        function startAutoPlay() {
          autoPlayInterval = setInterval(() => {
            const newIndex = (currentIndex + 1) % carouselItems.length;
            showCarouselItem(newIndex);
          }, 3000);
        }

        function stopAutoPlay() {
          clearInterval(autoPlayInterval);
        }

        carouselInner.addEventListener("mouseenter", stopAutoPlay);
        carouselInner.addEventListener("mouseleave", startAutoPlay);

        startAutoPlay();
      });
    </script>
  </body>
</html>
